    (function () {
      var siteRoot = new URL('../', window.location.href);
      var cssUrl = new URL('assets/css/site.css?v=20260908-wide1', siteRoot);

      function rewriteUrls(shadow) {
        shadow.querySelectorAll('[src], [href]').forEach(function (node) {
          ['src', 'href'].forEach(function (attribute) {
            var value = node.getAttribute(attribute);
            if (!value || /^(?:#|https?:|mailto:|tel:|javascript:|\/)/i.test(value)) return;
            node.setAttribute(attribute, new URL(value, siteRoot).href);
          });
        });
      }

      function initHeader(shadow) {
        var header = shadow.querySelector('[data-site-header]');
        if (!header) return;
        var groups = shadow.querySelectorAll('.primary-nav > .nav-group');
        function setVisual(active) {
          var color = active ? '#edf5fc' : '#fff';
          groups.forEach(function (group) {
            group.style.setProperty('background-color', color, 'important');
            group.querySelector(':scope > .nav-trigger')?.style.setProperty('background-color', color, 'important');
          });
          shadow.querySelectorAll('.lbl-header, .lbl-header .header-shell, .lbl-header .desktop-navigation, .lbl-header .header-top-row, .lbl-header .primary-nav').forEach(function (node) {
            node.style.setProperty('background-color', color, 'important');
          });
        }
        setVisual(false);
        shadow.querySelectorAll('.nav-group').forEach(function (group) {
          group.addEventListener('mouseenter', function () {
            shadow.querySelectorAll('.nav-group.open').forEach(function (item) {
              if (item !== group) {
                item.classList.remove('open', 'dismissed');
                item.querySelector('.nav-trigger')?.setAttribute('aria-expanded', 'false');
              }
            });
            group.classList.remove('dismissed');
            group.classList.add('open');
            group.querySelector('.nav-trigger')?.setAttribute('aria-expanded', 'true');
            if (group.matches('.primary-nav > .nav-group')) setVisual(true);
          });
          group.addEventListener('mouseleave', function () {
            window.setTimeout(function () {
              if (group.matches(':hover') || group.matches(':focus-within')) return;
              group.classList.remove('open');
              group.querySelector('.nav-trigger')?.setAttribute('aria-expanded', 'false');
              if (!header.matches(':hover')) setVisual(false);
            }, 220);
          });
        });
        header.addEventListener('mouseleave', function () {
          shadow.querySelectorAll('.nav-group.open, .nav-group.dismissed').forEach(function (group) {
            group.classList.remove('open', 'dismissed');
            group.querySelector('.nav-trigger')?.setAttribute('aria-expanded', 'false');
          });
          setVisual(false);
        });
        shadow.querySelectorAll('[data-menu-close]').forEach(function (button) {
          button.addEventListener('click', function () {
            var group = button.closest('.nav-group');
            group?.classList.remove('open');
            group?.classList.add('dismissed');
            group?.querySelector('.nav-trigger')?.setAttribute('aria-expanded', 'false');
            setVisual(false);
          });
        });
      }

      async function mount(hostId, componentPath, isHeader) {
        var host = document.getElementById(hostId);
        if (!host) return;
        var response = await fetch(new URL(componentPath, siteRoot));
        var cssResponse = await fetch(cssUrl);
        if (!response.ok || !cssResponse.ok) throw new Error('PETLab component load failed');
        var shadow = host.attachShadow({ mode: 'open' });
        var cssText = await cssResponse.text();
        cssText = cssText.replace(/url\((['"]?)\.\.\/([^'")]+)\1\)/g, function (_, quote, asset) {
          return 'url(' + quote + new URL('assets/' + asset, siteRoot).href + quote + ')';
        });
        cssText += '@media (min-width:1101px){' +
          '.lbl-header,.lbl-header .header-shell,.lbl-header .desktop-navigation,.lbl-header .primary-nav,.lbl-header .nav-group{overflow:visible!important;}' +
          '.lbl-header .nav-group.open>.mega-menu,.lbl-header .nav-group:hover>.mega-menu,.lbl-header .nav-group:focus-within>.mega-menu{display:grid!important;z-index:2000!important;pointer-events:auto;}' +
          '.lbl-header .nav-group.dismissed>.mega-menu{display:none!important;}' +
          '.lbl-header .primary-nav>.nav-group,.lbl-header .primary-nav>.nav-group>.nav-trigger{background:#fff!important;transition:none!important;}' +
          '.lbl-header:has(.primary-nav>.nav-group:hover,.primary-nav>.nav-group:focus-within,.primary-nav>.nav-group.open),.lbl-header:has(.primary-nav>.nav-group:hover,.primary-nav>.nav-group:focus-within,.primary-nav>.nav-group.open) .header-shell,.lbl-header:has(.primary-nav>.nav-group:hover,.primary-nav>.nav-group:focus-within,.primary-nav>.nav-group.open) .primary-nav,.lbl-header:has(.primary-nav>.nav-group:hover,.primary-nav>.nav-group:focus-within,.primary-nav>.nav-group.open) .primary-nav>.nav-group,.lbl-header:has(.primary-nav>.nav-group:hover,.primary-nav>.nav-group:focus-within,.primary-nav>.nav-group.open) .primary-nav>.nav-group>.nav-trigger{background:#edf5fc!important;}' +
          '.lbl-header .mega-menu__groups a{display:flex!important;align-items:flex-start;gap:1rem;padding-left:0!important;}.lbl-header .mega-menu__groups a::before{position:static!important;flex:0 0 6px;margin-top:.48em;}' +
          '}';
        var style = document.createElement('style');
        style.textContent = cssText.replace(/^:root\s*\{/, ':host {');
        shadow.appendChild(style);
        var content = document.createElement('div');
        content.innerHTML = await response.text();
        while (content.firstChild) shadow.appendChild(content.firstChild);
        rewriteUrls(shadow);
        if (isHeader) initHeader(shadow);
        else shadow.querySelector('[data-current-year]')?.replaceChildren(String(new Date().getFullYear()));
      }

      Promise.all([
        mount('petlab-header', 'components/header-cn.html?v=20260920-programs1', true),
        mount('petlab-footer', 'components/footer-cn.html?v=20260811-119', false)
      ]).catch(function (error) { console.error('Unable to load PETLab components', error); });
    }());
  </script>

<script>
/* Hide skip-link by default, show on keyboard focus */
(function(){
  function fixSkipLink(link){
    if(link.dataset.skipLinkFixed3) return;
    link.dataset.skipLinkFixed3 = '1';
    link.classList.remove('visually-hidden');
    link.style.setProperty('position','fixed','important');
    link.style.setProperty('top','0','important');
    link.style.setProperty('left','1rem','important');
    link.style.setProperty('z-index','9999','important');
    link.style.setProperty('transform','translateY(-200%)','important');
    link.style.setProperty('background','#fff','important');
    link.style.setProperty('padding','.75rem 1rem','important');
    link.style.setProperty('text-decoration','none','important');
    link.style.setProperty('color','#000','important');
    link.style.setProperty('transition','transform .2s ease','important');
    link.style.setProperty('clip','auto','important');
    link.style.setProperty('width','auto','important');
    link.style.setProperty('height','auto','important');
    link.style.setProperty('overflow','visible','important');
    link.addEventListener('focus',function(){link.style.setProperty('transform','translateY(0)','important');});
    link.addEventListener('blur',function(){link.style.setProperty('transform','translateY(-200%)','important');});
  }
  function fixAll(){document.querySelectorAll('.skip-link').forEach(fixSkipLink);}
  fixAll();
  var observer = new MutationObserver(fixAll);
  observer.observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fixAll);
  window.addEventListener('load',function(){setTimeout(fixAll,100);});
})();
</script>
