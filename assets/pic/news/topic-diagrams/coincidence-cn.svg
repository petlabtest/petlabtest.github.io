<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">为何两束光能够提供位置信息</title><desc id="desc">符合探测的几何起点，而非光电转换或读出电路</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#123653"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#f6c779"/></marker></defs>
<rect width="1200" height="640" rx="12" fill="url(#bg)"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="600" y="68" font-size="40" fill="#e8f1f8" text-anchor="middle">为何两束光能够提供位置信息</text><text x="600" y="111" font-size="23" fill="#abc4d7" text-anchor="middle">符合探测的几何起点，而非光电转换或读出电路</text><circle cx="600" cy="339" r="181" stroke="#406d8e" stroke-width="32" fill="none"/><rect x="378" y="305" width="55" height="68" rx="6" fill="#70b9e4"/><rect x="766" y="305" width="55" height="68" rx="6" fill="#70b9e4"/><path d="M443 339 L756 339" stroke="#99bbd3" stroke-width="3" fill="none"/><circle cx="558" cy="339" r="10" fill="#ffe4a0"/><path d="M545 339 L439 339" stroke="#f6c779" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M571 339 L757 339" stroke="#f6c779" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="244" y="330" font-size="28" fill="#e8f1f8" text-anchor="middle">探测器 A</text><text x="954" y="330" font-size="28" fill="#e8f1f8" text-anchor="middle">探测器 B</text><text x="600" y="269" font-size="28" fill="#e8f1f8" text-anchor="middle">响应线 LOR</text><text x="558" y="400" font-size="25" fill="#f6c779" text-anchor="middle">湮没位置</text><text x="600" y="562" font-size="26" fill="#e8f1f8" text-anchor="middle">一次符合事件约束一条线；大量响应线参与重建</text><text x="600" y="607" font-size="22" fill="#abc4d7" text-anchor="middle">示意图：忽略散射、随机符合与非共线性</text></g>
</svg>