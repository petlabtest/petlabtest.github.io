<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" lang="en">
<title id="title">From Light Quanta to Photoemission</title><desc id="desc">Quantized energy exchange: frequency and intensity have different roles</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#123653"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#f6c779"/></marker></defs>
<rect width="1200" height="640" rx="12" fill="url(#bg)"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="600" y="68" font-size="40" fill="#e8f1f8" text-anchor="middle">From Light Quanta to Photoemission</text><text x="600" y="111" font-size="23" fill="#abc4d7" text-anchor="middle">Quantized energy exchange: frequency and intensity have different roles</text><rect x="367" y="213" width="420" height="226" rx="12" fill="#628099"/><text x="577" y="400" font-size="29" fill="#e8f1f8" text-anchor="middle">Metal surface</text><path d="M196 265 L368 265" stroke="#f6c779" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="220" y="215" font-size="27" fill="#f6c779" text-anchor="middle">Photon hν</text><circle cx="800" cy="215" r="13" fill="#71c7ff"/><path d="M720 274 L846 184" stroke="#f6c779" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="932" y="224" font-size="27" fill="#71c7ff" text-anchor="middle">Emitted electron e⁻</text><text x="600" y="508" font-size="38" fill="#e8f1f8" text-anchor="middle">Eₖ,max = hν − Φ</text><text x="600" y="565" font-size="25" fill="#abc4d7" text-anchor="middle">Φ: work function; external photoemission, not a SiPM avalanche</text></g>
