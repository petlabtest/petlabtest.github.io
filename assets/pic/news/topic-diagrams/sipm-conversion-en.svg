ells</text><path d="M740 320 L838 320" stroke="#f6c779" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M865 389 L905 389 L925 247 Q940 332 963 354 Q1000 386 1100 389" fill="none" stroke="#80d9d0" stroke-width="6"/><text x="987" y="475" font-size="30" fill="#e8f1f8" text-anchor="middle">Electrical pulse</text><text x="600" y="550" font-size="26" fill="#e8f1f8" text-anchor="middle">Photon absorption → electron–hole pair → avalanche → quench and recharge</text><text x="600" y="604" font-size="23" fill="#abc4d7" text-anchor="middle">Schematic: digitization and image reconstruction follow in the next stage</text></g>
