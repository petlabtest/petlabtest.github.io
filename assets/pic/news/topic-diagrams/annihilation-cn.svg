<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="600" y="68" font-size="40" fill="#e8f1f8" text-anchor="middle">正负电子相遇，双光子诞生</text><text x="600" y="111" font-size="23" fill="#abc4d7" text-anchor="middle">从粒子事件到辐射：本图不表示带电粒子的放电</text><circle cx="445" cy="222" r="34" fill="#247cbd"/><circle cx="755" cy="222" r="34" fill="#bb7541"/><text x="445" y="233" font-size="32" fill="#e8f1f8" text-anchor="middle">e⁻</text><text x="755" y="233" font-size="32" fill="#e8f1f8" text-anchor="middle">e⁺</text><text x="445" y="177" font-size="28" fill="#e8f1f8" text-anchor="middle">电子</text><text x="755" y="177" font-size="28" fill="#e8f1f8" text-anchor="middle">正电子</text><path d="M488 222 L565 222" stroke="#f6c779" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M712 222 L635 222" stroke="#f6c779" stroke-width="5" fill="none" marker-end="url(#arrow)"/><circle cx="600" cy="222" r="12" fill="#ffe5aa"/><path d="M600 246 L600 331" stroke="#688ba4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="600" cy="380" r="10" fill="#ffe5aa"/><path d="M588 380 L220 380" stroke="#f6c779" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M612 380 L980 380" stroke="#f6c779" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="340" y="347" font-size="32" fill="#f6c779" text-anchor="middle">γ · 511 keV</text><text x="860" y="347" font-size="32" fill="#f6c779" text-anchor="middle">γ · 511 keV</text><text x="600" y="454" font-size="38" fill="#e8f1f8" text-anchor="middle">e⁻ + e⁺ → γ + γ</text><text x="600" y="509" font-size="28" fill="#e8f1f8" text-anchor="middle">能量守恒：2mₑc² ≈ 1.022 MeV</text><text x="600" y="575" font-size="23" fill="#abc4d7" text-anchor="middle">理想化：静止质心系中的双光子湮没；光子沿直线反向传播</text></g>
