<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">同一种光，不同的能量尺度</title><desc id="desc">光谱决定材料选择，不能把普通相机与伽马探测器等同</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#123653"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#f6c779"/></marker></defs>
<rect width="1200" height="640" rx="12" fill="url(#bg)"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="600" y="68" font-size="40" fill="#e8f1f8" text-anchor="middle">同一种光，不同的能量尺度</text><text x="600" y="111" font-size="23" fill="#abc4d7" text-anchor="middle">光谱决定材料选择，不能把普通相机与伽马探测器等同</text><rect x="58" y="252" width="145" height="90" rx="8" fill="#355676"/><text x="130" y="387" font-size="25" fill="#e8f1f8" text-anchor="middle">无线电波</text><rect x="213" y="252" width="145" height="90" rx="8" fill="#376d91"/><text x="285" y="387" font-size="25" fill="#e8f1f8" text-anchor="middle">微波</text><rect x="368" y="252" width="145" height="90" rx="8" fill="#ad6651"/><text x="440" y="387" font-size="25" fill="#e8f1f8" text-anchor="middle">红外</text><rect x="523" y="252" width="145" height="90" rx="8" fill="#f6d986"/><text x="595" y="387" font-size="25" fill="#e8f1f8" text-anchor="middle">可见光</text><rect x="678" y="252" width="145" height="90" rx="8" fill="#6c6bba"/><text x="750" y="387" font-size="25" fill="#e8f1f8" text-anchor="middle">紫外</text><rect x="833" y="252" width="145" height="90" rx="8" fill="#8370ca"/><text x="905" y="387" font-size="25" fill="#e8f1f8" text-anchor="middle">X 射线</text><rect x="988" y="252" width="145" height="90" rx="8" fill="#b78cdb"/><text x="1060" y="387" font-size="25" fill="#e8f1f8" text-anchor="middle">伽马射线</text><path d="M110 459 L1080 459" stroke="#f6c779" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="600" y="513" font-size="30" fill="#e8f1f8" text-anchor="middle">频率与单光子能量升高：E = hν</text><text x="600" y="570" font-size="24" fill="#abc4d7" text-anchor="middle">概念排列，非按比例；PET 的伽马光先在晶体中转为可见光</text></g>
</svg>